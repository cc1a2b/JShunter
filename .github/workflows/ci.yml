name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', '1.25.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check gofmt (new files only)
        run: |
          # Several pre-existing files are intentionally left unformatted, so the
          # gate is scoped to the files this change introduces.
          test -z "$(gofmt -l internal/jshunter/rules_ext.go internal/jshunter/validators_ext.go)" \
            || { echo "::error::gofmt required on:"; \
                 gofmt -l internal/jshunter/rules_ext.go internal/jshunter/validators_ext.go; \
                 exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test ./... -race -count=1

      - name: Rule registry self-test
        run: go run ./cmd/jshunter --self-test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          # golangci-lint-action manages its own caching; disable setup-go's to
          # avoid two caches fighting over the same keys.
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m
