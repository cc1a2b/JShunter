# golangci-lint configuration (v2 schema; consumed by golangci-lint-action@v7).
# Deliberately lean: a small set of high-signal linters, no style-nitpick noise.
version: "2"

run:
  tests: true

linters:
  # Start from nothing and opt in, so a golangci-lint upgrade never silently
  # enables a noisy new default linter.
  default: none
  enable:
    - govet        # suspicious constructs the compiler will not catch
    - staticcheck  # correctness, simplification, and deprecation checks
    - errcheck     # unchecked error returns
    - ineffassign  # assignments whose value is never used
    - unconvert    # redundant type conversions
    - misspell     # common English misspellings in comments and strings

  settings:
    misspell:
      locale: US
    staticcheck:
      # Correctness, simplification and deprecation only. The style (ST) and
      # quickfix (QF) categories are excluded deliberately: this package uses a
      # per-file underscore prefix for test helpers, which ST1003 objects to.
      checks: ["all", "-ST*", "-QF*"]

  exclusions:
    rules:
      # `licence` and `colour` are entries in the benign-binding token lists,
      # not prose: real code uses those spellings and the lists must match it.
      - path: internal/jshunter/structure\.go
        linters:
          - misspell
      # The pre-v0.8 files carry a lint backlog that predates this gate ever
      # running: golangci-lint errored out on the Go version before it analysed
      # anything, so the job was red without producing findings. Everything
      # added from v0.8 on is gated; these are excluded until the backlog is
      # cleared on its own change rather than inside a feature release.
      - path: internal/jshunter/(jshunter|cache|sourcemap|verify|robots|ignore|aws_pair)\.go
        linters:
          - errcheck
          - misspell
          - staticcheck
          - ineffassign
      - path: internal/jshunter/scoring_test\.go
        linters:
          - staticcheck
      # Test files routinely ignore errors on helpers and setup, and fixture
      # strings trip the spell-checker; keep those out of the report.
      - path: _test\.go
        linters:
          - errcheck
          - misspell

issues:
  # Report every hit; do not collapse duplicates. Keeps the signal honest.
  max-issues-per-linter: 0
  max-same-issues: 0
